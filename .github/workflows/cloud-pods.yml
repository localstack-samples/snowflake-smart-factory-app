name: Create and Test Cloud Pods

on:
  schedule:
    # At 00:00 on Saturday.
    - cron: "0 0 * * 6"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  # the Snowflake emulator from docker-compose.yml, as seen from the runner
  SNOWFLAKE_ENDPOINT: http://localhost.localstack.cloud:4567

jobs:
  create-cloud-pod:
    name: Create Cloud Pods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snow CLI and lstk
        run: |
          pip install snowflake-cli==3.7.2
          snow --version
          snow connection add \
            --connection-name localstack \
            --user test \
            --password test \
            --account test \
            --role test \
            --warehouse test \
            --database test \
            --schema test \
            --port 4567 \
            --host snowflake.localhost.localstack.cloud \
            --no-interactive
          snow connection list
          npm install -g @localstack/lstk

      - name: Install dependencies
        run: |
          make install

      - name: Start LocalStack for AWS and the Snowflake emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          make start

      - name: Create Snowflake resources
        run: |
          make seed

      - name: Create AWS resources
        run: |
          make aws
          make upload

      - name: Run dbt models
        run: |
          make dbt

      # The Native App (make app) is not deployed: Snowflake Next does not support application packages yet
      # (CREATE APPLICATION PACKAGE, SHOW APPLICATION PACKAGES)

      - name: Create Cloud Pod
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          lstk --endpoint-url "$SNOWFLAKE_ENDPOINT" --non-interactive save pod:smart-factory-app

      - name: Show LocalStack Logs
        if: always()
        run: |
          docker compose logs --tail 300

  test-cloud-pod:
    name: Test Cloud Pod
    needs: create-cloud-pod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests only query Snowflake, so the AWS container is not needed here
      - name: Start the Snowflake emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          docker compose up --detach --wait localstack-snowflake

      - name: Load Cloud Pod
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          npm install -g @localstack/lstk
          lstk --endpoint-url "$SNOWFLAKE_ENDPOINT" --non-interactive load pod:smart-factory-app

      - name: Install dependencies
        run: |
          make install

      - name: Run Tests
        run: |
          pip3 install pytest pandas numpy snowflake-connector-python
          pytest tests/

      - name: Show LocalStack Logs
        if: always()
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          docker compose logs --tail 300
