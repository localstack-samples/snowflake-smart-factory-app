name: LocalStack CI

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # “At 00:00 on Sunday.”
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  deploy-snowflake:
    name: Deploy to Snowflake emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Install Snow CLI
        run: |
          pip install snowflake-cli==3.7.2
          snow --version
          snow connection add \
            --connection-name localstack \
            --user test \
            --password test \
            --account test \
            --role test \
            --warehouse test \
            --database test \
            --schema test \
            --port 4567 \
            --host snowflake.localhost.localstack.cloud \
            --no-interactive
          snow connection list

      - name: Start LocalStack for AWS and the Snowflake emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          make start

      - name: Install dependencies
        run: |
          make install

      - name: Create Snowflake resources
        run: |
          make seed

      - name: Create AWS resources
        run: |
          make aws
          make upload

      - name: Run dbt models
        run: |
          make dbt

      # The Native App (make app) is not deployed: Snowflake Next does not support application packages yet
      # (CREATE APPLICATION PACKAGE, SHOW APPLICATION PACKAGES)

      - name: Run tests
        run: |
          pip3 install pytest pandas numpy
          make test

      - name: Show LocalStack logs
        if: failure()
        run: |
          docker compose logs --tail 300
